<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incident Capture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            color: #1a1a1a;
            width: 420px;
            padding: 12px;
            line-height: 1.5;
        }

        header {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e8e8e8;
        }

        h1 {
            font-size: 14px;
            font-weight: 600;
            color: #0a0a0a;
            margin-bottom: 2px;
        }

        .subtitle {
            font-size: 11px;
            color: #666;
        }

        #status {
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 12px;
            background: #f5f5f5;
            color: #666;
        }

        #status.error {
            background: #fef2f2;
            color: #7f1f1f;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            border-bottom: 1px solid #e8e8e8;
        }

        .tab-button {
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 500;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-button.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
        }

        .tab-button:hover {
            color: #1a1a1a;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #666;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 6px 8px;
            font-size: 11px;
            border: 1px solid #d8d8d8;
            border-radius: 4px;
            background: #fafafa;
            color: #1a1a1a;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            background: white;
            border-color: #333;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 8px 0;
        }

        input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-size: 11px;
            text-transform: none;
            letter-spacing: normal;
            color: #1a1a1a;
        }

        .button-row {
            display: flex;
            gap: 6px;
            margin: 10px 0;
        }

        button {
            flex: 1;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid #d8d8d8;
            background: white;
            color: #1a1a1a;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        button.primary {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
        }

        button.primary:hover {
            background: #333;
            border-color: #333;
        }

        textarea[readonly] {
            background: #f5f5f5;
            color: #666;
            max-height: 120px;
            font-size: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
        }
    </style>
</head>
<body>
    <header>
        <h1>Incident Capture</h1>
        <p class="subtitle">Monitor and collect incident data</p>
    </header>

    <div id="status">Loading...</div>

    <div class="tabs">
        <button class="tab-button active" data-tab="config">Configuration</button>
        <button class="tab-button" data-tab="snapshot">Data</button>
    </div>

    <!-- Configuration Tab -->
    <div id="tab-config" class="tab-content active">
        <div class="form-group">
            <label for="endpointUrl">Endpoint URL</label>
            <input id="endpointUrl" type="text" placeholder="https://api.example.com/incidents" />
        </div>

        <div class="form-group">
            <label for="endpointToken">API Token (optional)</label>
            <input id="endpointToken" type="password" placeholder="Bearer token" />
        </div>

        <div class="checkbox-group">
            <input id="autoSend" type="checkbox" />
            <label for="autoSend">Auto-send on error detection</label>
        </div>

        <div class="button-row">
            <button id="saveSettings" class="primary">Save</button>
            <button id="createSnapshot">Create Snapshot</button>
            <button id="sendLast">Send</button>
        </div>

        <button id="openReportBtn" class="primary" style="width: 100%; margin-top: 8px;">
            Open Report Generator
        </button>
    </div>

    <!-- Data Tab -->
    <div id="tab-snapshot" class="tab-content">
        <div class="form-group">
            <label for="snapshotOutput">Last Incident Data</label>
            <textarea id="snapshotOutput" readonly></textarea>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
